name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js (for bats)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install bats-core
        run: npm install -g bats
      
      - name: Verify required tools (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          which jq
          which curl
          which tar
          which bats
      
      - name: Verify required tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          which jq
          which curl
          which tar
          which bats
      
      - name: Run tests (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          bats --print-output-on-failure tests/ 2>&1 | tee bats.log && exit 0
          echo "::group::Failure summary"
          if grep -q "^not ok" bats.log; then
            grep -n -A 20 "^not ok" bats.log
          else
            echo "No 'not ok' lines: bats itself failed (setup_file/teardown/harness), not a test body."
            tail -40 bats.log
          fi
          echo "::endgroup::"
          exit 1
      
      - name: Run tests (Windows - Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          bats --print-output-on-failure tests/ 2>&1 | tee bats.log && exit 0
          echo "::group::Failure summary"
          if grep -q "^not ok" bats.log; then
            grep -n -A 20 "^not ok" bats.log
          else
            echo "No 'not ok' lines: bats itself failed (setup_file/teardown/harness), not a test body."
            tail -40 bats.log
          fi
          echo "::endgroup::"
          exit 1
      
      - name: Upload bats log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bats-log-${{ matrix.os }}
          path: bats.log
          if-no-files-found: ignore

  release-parity:
    name: Every tag has a GitHub Release
    runs-on: ubuntu-latest
    # `--version latest` resolves through /releases/latest, which cannot see a
    # bare tag — so a pushed tag with no Release silently pins consumers to an
    # older version. Fail the build instead of discovering it from a stale
    # crew.lock weeks later.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare tags against releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort > /tmp/tags
          gh release list --limit 200 --json tagName \
            --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}' | sort > /tmp/releases

          missing=$(comm -23 /tmp/tags /tmp/releases)
          if [[ -n "$missing" ]]; then
            echo "::error::Tags with no GitHub Release (consumers on --version latest cannot see these):"
            echo "$missing"
            echo "Fix: gh release create <tag> --notes-file <notes>  (or re-push the tag to trigger release.yml)"
            exit 1
          fi
          echo "All $(wc -l < /tmp/tags) tags have releases."
