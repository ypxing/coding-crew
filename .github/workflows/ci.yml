name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # solve-feature's job dispatches this on its PR's branch when GitHub refuses it approving the held pull_request run.
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite is several minutes of macOS CPU.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # No native Windows job: Windows is supported through WSL2 (README), which the ubuntu job
      # covers; under Git Bash's emulated fork() the suite is slow and fails mostly on its quirks.
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macOS ships bash 3.2 at /bin/bash; install.sh's re-exec guard and several scripts
      # need bash >= 4, so put one on PATH before anything else runs bash.
      - name: Install bash >= 4 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      # bats-core is pure bash: a pinned tag clone avoids `npm install -g bats` and its Node setup.
      - name: Install bats-core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$HOME/bats-core"
          echo "BATS=$HOME/bats-core/bin/bats" >> "$GITHUB_ENV"

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          which jq
          which curl
          which tar
          "$BATS" --version

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          # One bats process per file, CPU-count at a time: bats alone runs files serially.
          bash scripts/ci-run-bats.sh --log-dir "$RUNNER_TEMP/bats-logs" tests/*.bats 2>&1 | tee bats.log && exit 0
          echo "::group::Failure summary"
          if grep -q "^not ok" bats.log; then
            grep -n -A 20 "^not ok" bats.log
          else
            echo "No 'not ok' lines: bats itself failed (setup_file/teardown/harness), not a test body."
            tail -40 bats.log
          fi
          echo "::endgroup::"
          exit 1

      - name: Upload bats log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bats-log-${{ matrix.os }}
          path: |
            bats.log
            ${{ runner.temp }}/bats-logs/
          if-no-files-found: ignore
