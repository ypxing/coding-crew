name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The suite's cost is process spawning, not computation: ~550 bats tests, ~84 full
      # install.sh runs, each spawning ~1,500 jq calls. Git Bash has no fork() (it
      # emulates it), so Windows was taking 27+ minutes for a suite that runs in 2 on
      # Linux. bats' own --jobs needs GNU parallel, which the Windows runner does not
      # have, so Windows is parallelised across the matrix instead — scripts/ci-test-shard.sh
      # partitions tests/ deterministically and tests/ci-test-shard.bats proves the
      # partition is complete, so a dropped file cannot go unnoticed.
      matrix:
        include:
          - os: ubuntu-latest
            shard: "1/1"
          - os: macos-latest
            shard: "1/1"
          - os: windows-latest
            shard: "1/4"
          - os: windows-latest
            shard: "2/4"
          - os: windows-latest
            shard: "3/4"
          - os: windows-latest
            shard: "4/4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Defender scans every file the installs copy into the work and temp trees, and
      # this suite writes thousands of small files. Excluding them is worth ~20-40% on
      # a file-heavy Windows job. Non-fatal: a hardened runner may refuse.
      - name: Exclude runner paths from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, "$env:TEMP"
          Add-MpPreference -ExclusionProcess "bash.exe", "git.exe", "jq.exe"

      # bats-core is pure bash — cloning a pinned tag avoids `npm install -g bats`
      # (and the Node setup it needed), which alone cost ~1 minute on Windows.
      - name: Install bats-core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$HOME/bats-core"
          echo "BATS=$HOME/bats-core/bin/bats" >> "$GITHUB_ENV"

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          which jq
          which curl
          which tar
          "$BATS" --version

      - name: Run tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # Read the shard as index/total; the script fails loudly on a bad pair rather
          # than printing an empty file list and passing having tested nothing.
          index="${SHARD%%/*}"
          total="${SHARD##*/}"
          # while-read, not mapfile: the macOS runner's /bin/bash is 3.2.
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] && files+=("$f")
          done < <(bash scripts/ci-test-shard.sh "$index" "$total")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::shard $SHARD selected no test files"; exit 1; }
          echo "Shard $SHARD: ${#files[@]} test files"

          "$BATS" --print-output-on-failure "${files[@]}" 2>&1 | tee bats.log && exit 0
          echo "::group::Failure summary"
          if grep -q "^not ok" bats.log; then
            grep -n -A 20 "^not ok" bats.log
          else
            echo "No 'not ok' lines: bats itself failed (setup_file/teardown/harness), not a test body."
            tail -40 bats.log
          fi
          echo "::endgroup::"
          exit 1

      - name: Upload bats log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bats-log-${{ matrix.os }}-${{ strategy.job-index }}
          path: bats.log
          if-no-files-found: ignore

  release-parity:
    name: Every tag has a GitHub Release
    runs-on: ubuntu-latest
    # `--version latest` resolves through /releases/latest, which cannot see a
    # bare tag — so a pushed tag with no Release silently pins consumers to an
    # older version. Fail the build instead of discovering it from a stale
    # crew.lock weeks later.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare tags against releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort > /tmp/tags
          gh release list --limit 200 --json tagName \
            --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}' | sort > /tmp/releases

          missing=$(comm -23 /tmp/tags /tmp/releases)
          if [[ -n "$missing" ]]; then
            echo "::error::Tags with no GitHub Release (consumers on --version latest cannot see these):"
            echo "$missing"
            echo "Fix: gh release create <tag> --notes-file <notes>  (or re-push the tag to trigger release.yml)"
            exit 1
          fi
          echo "All $(wc -l < /tmp/tags) tags have releases."
