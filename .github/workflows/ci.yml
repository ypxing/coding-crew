name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # The orchestrator's sprint suite is ~10 minutes of macOS CPU, split across ten topic files.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # No native Windows job: Windows is supported through WSL2 (README), which the
      # ubuntu job covers. Git Bash emulates fork(), so the suite took four 14-35 minute
      # shards there, and its failures were mostly Git Bash quirks, not user-facing bugs.
      # scripts/ci-test-shard.sh splits tests/ by measured time (tests/ci-shard-weights.tsv)
      # for any "k/n" shard below; tests/ci-test-shard.bats proves the split is complete.
      matrix:
        include:
          - os: ubuntu-latest
            shard: "1/1"
          # macOS is ~2x ubuntu's wall time on one job; free for a public repo, so split it.
          - os: macos-latest
            shard: "1/3"
          - os: macos-latest
            shard: "2/3"
          - os: macos-latest
            shard: "3/3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macOS ships bash 3.2 at /bin/bash (Apple froze it there after the GPLv2 -> GPLv3
      # switch). install.sh's own re-exec guard and several scripts (declare -A, empty
      # array expansion under `set -u`) need bash >= 4, so give the runner one on PATH
      # before anything else runs bash.
      - name: Install bash >= 4 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      # bats-core is pure bash — cloning a pinned tag avoids `npm install -g bats`
      # (and the Node setup it needed).
      - name: Install bats-core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$HOME/bats-core"
          echo "BATS=$HOME/bats-core/bin/bats" >> "$GITHUB_ENV"

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          which jq
          which curl
          which tar
          "$BATS" --version

      - name: Run tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          # Read the shard as index/total; the script fails loudly on a bad pair rather
          # than printing an empty file list and passing having tested nothing.
          index="${SHARD%%/*}"
          total="${SHARD##*/}"
          # while-read, not mapfile: the macOS runner's /bin/bash is 3.2.
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] && files+=("$f")
          done < <(bash scripts/ci-test-shard.sh "$index" "$total")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::shard $SHARD selected no test files"; exit 1; }
          echo "Shard $SHARD: ${#files[@]} test files"

          # One bats process per file, CPU-count at a time: bats alone runs files serially.
          bash scripts/ci-run-bats.sh --log-dir "$RUNNER_TEMP/bats-logs" "${files[@]}" 2>&1 | tee bats.log && exit 0
          echo "::group::Failure summary"
          if grep -q "^not ok" bats.log; then
            grep -n -A 20 "^not ok" bats.log
          else
            echo "No 'not ok' lines: bats itself failed (setup_file/teardown/harness), not a test body."
            tail -40 bats.log
          fi
          echo "::endgroup::"
          exit 1

      - name: Upload bats log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bats-log-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            bats.log
            ${{ runner.temp }}/bats-logs/
          if-no-files-found: ignore
