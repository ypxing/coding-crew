name: solve-feature

# Runs solve-feature on this repo's features: a caller of coding-crew's reusable workflow, whose header explains
# the rest (the triggers' rules, review rounds, models, billing): https://github.com/ypxing/coding-crew, file
# .github/workflows/crew-solve-feature.yml. /setup-coding-crew writes this file; it holds only the triggers, the
# permissions and the secrets passed.
#
# /setup-coding-crew writes the `uses:` ref below as that release's full commit SHA with the version in a trailing
# comment (`@<sha>  # vX.Y.Z`), since a tag can be moved. Update it with a Dependabot `github-actions` PR (which bumps
# the SHA and the comment together), or update the installed coding-crew skills to the new release first (re-run
# install.sh, or the `npx skills add` command you installed with) and then run `/setup-coding-crew redo actions`, which writes the installed
# skills' release. A Bedrock role's trust policy pins this SHA too: update it with each bump. The SHA fixes the
# reusable workflow file, not its inner `ypxing/coding-crew/actions/install@<tag>`, which is resolved when the job runs: that tag is
# protected by coding-crew's release-tag ruleset, which admins can bypass, and GitHub's Immutable releases locks it
# for releases published after that setting is enabled. Pass `timeout-minutes:` under `with:` to change the solve job's timeout (360 by default). The
# checks this workflow adds to a PR are named `run / <job>`.
on:
  issues:
    types: [labeled, unlabeled, closed]
  # Not pull_request_review_comment: a reply on a thread is a submitted review too, so it would start a second round.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      slug:
        description: The feature slug (the root issue's `Feature:` line)
        required: true
        type: string
  # Uncomment to retry stopped features on a timer; the dispatch slug has to come from elsewhere then.
  # schedule:
  #   - cron: "0 6 * * 1-5"

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write
  actions: write
  id-token: write

jobs:
  run:
    uses: ypxing/coding-crew/.github/workflows/crew-solve-feature.yml@v2.3.8
    with:
      slug: ${{ inputs.slug }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
