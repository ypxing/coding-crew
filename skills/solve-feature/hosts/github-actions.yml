name: solve-feature

# Runs one feature's issues unattended with the Copilot CLI, billed to GitHub Copilot: no API key.
#
# Setup: copy this file to .github/workflows/ in your repo (install.sh never writes there), commit
# a .coding-crew/dev-commands.json (run /solve-issue or dep-install once by hand), then label the
# feature's root issue `solve-feature`, or run the workflow by hand with the slug.
#
# The slug for the label trigger is the root issue's `Feature: <slug>` line, which the GitHub
# tracker writes on every root issue; labelling any other issue fails the slug step.
# The label is not removed afterwards: the concurrency group makes a re-label wait for the run in
# flight rather than start a second one on the same branch.
#
# The Copilot CLI runs the solve-feature skill, which runs each coder, the reviewer and the fixer as
# its own subagents. The review runs inside the same job, from the skill: a PR opened or marked ready
# with the workflow's own GITHUB_TOKEN triggers no other workflow, so a `pull_request` job would never
# fire. The session's exit code does not carry a stop, so the last step fails the job unless the
# run's fix step wrote .solve-feature/reviewed: on a stop the scripts recorded (.solve-feature/stopped,
# with the reason), and on a session that ended before the fix step for any other reason.
#
# Billing: with `github.token` the Copilot CLI bills under the organisation policy "Allow use of
# Copilot CLI billed to the organization" (on by default where the CLI is enabled), see
# https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions. To bill a
# person instead, see the commented COPILOT_GITHUB_TOKEN block on the last step.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      slug:
        description: The feature slug (the root issue's `Feature:` line)
        required: true
        type: string
  # Uncomment to retry stopped features on a timer; the dispatch slug has to come from elsewhere then.
  # schedule:
  #   - cron: "0 6 * * 1-5"

env:
  # The coding-crew ref the runner installs. Pin it to the first tag cut after solve-feature's
  # hosts shipped (no tag before that has review-pr); `main` until then.
  CODING_CREW_REF: main

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  # The slug is a job of its own because a concurrency group can only read a job's outputs, never
  # a step's: the group below needs the slug, and the label trigger has it only in the issue body.
  slug:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'solve-feature'
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Read the slug
        id: slug
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        # The body goes through a file: interpolated into the shell line it could run as code.
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            slug="$INPUT_SLUG"
          else
            printf '%s\n' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
            slug="$(grep -m1 '^Feature:' "$RUNNER_TEMP/issue-body.md" | awk '{print $2}')"
          fi
          if [ -z "$slug" ]; then
            echo "::error::no 'Feature: <slug>' line in the issue body: label the feature's root issue"
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  solve:
    needs: slug
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # One run per feature at a time (the loop takes no lock); a second trigger waits, never cancels.
    concurrency:
      group: solve-feature-${{ needs.slug.outputs.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Copilot CLI
        run: npm install -g @github/copilot

      # User-level ($HOME), never into $GITHUB_WORKSPACE: a project-level install leaves
      # .github/skills/, .coding-crew/manifest.json and the asset trees untracked, and solve-feature
      # refuses a dirty tree. The scripts and the tracker CLI lookup fall back to $HOME/.coding-crew,
      # and copilot reads its user skills from $HOME/.copilot/skills.
      - name: Install coding-crew (user-level, copilot)
        run: |
          git clone --depth 1 --branch "$CODING_CREW_REF" https://github.com/ypxing/coding-crew /tmp/coding-crew
          TARGET_REPO="$HOME" bash /tmp/coding-crew/install.sh copilot --skills solve-feature,review-pr

      - name: Git identity for the runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run solve-feature
        env:
          SLUG: ${{ needs.slug.outputs.slug }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SOLVE_FEATURE_HOST: github-actions
          # To bill a person rather than the organisation, store a fine-grained PAT with the
          # "Copilot Requests" permission as a repo secret and pass it here. Unverified: that this
          # is the variable name the CLI reads in Actions, and that a personal (non-organisation)
          # account can bill an Actions run at all.
          # COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: copilot -p "Use the solve-feature skill on $SLUG" --allow-all-tools --no-color

      # .solve-feature/reviewed is written by the run's fix step, its last.
      - name: Fail the job unless the run ended in its fix step
        run: |
          if [ -e .solve-feature/stopped ]; then
            echo "::error::solve-feature stopped: $(cat .solve-feature/stopped)"; exit 1
          fi
          if [ ! -e .solve-feature/reviewed ]; then
            echo "::error::solve-feature never reached its fix step: nothing landed, or the session ended early (see the step above)"; exit 1
          fi
