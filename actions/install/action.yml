name: Install coding-crew
description: Installs the skills an Actions run uses (solve-feature, crew-review, address-pr-comments, crew-triage, to-issues and what they need) user-level, into $HOME, for one agent CLI.

# The runner downloads this action's repository at the ref the caller names, so the install needs no clone, token
# or fetch of its own: an organisation's internal copy of coding-crew works with only its Actions Access setting.
inputs:
  agent:
    description: The agent CLI to install for (copilot or claude)
    required: true

runs:
  using: composite
  steps:
    - name: Install coding-crew (user-level)
      shell: bash
      env:
        CREW_AGENT: ${{ inputs.agent }}
      run: TARGET_REPO="$HOME" bash "$GITHUB_ACTION_PATH/../../install.sh" "$CREW_AGENT" --skills solve-feature,crew-review,address-pr-comments,crew-triage,to-issues
